name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per ref. A new push cancels the previous run rather than queueing behind it.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Sling.App targets net10.0-windows with UseWPF, which does not build on Linux.
    # The whole solution is built on Windows so the runner matches the product.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Sling.slnx

      - name: Build
        # --no-restore so a restore failure is reported by the step above rather than
        # being folded into a confusing build error.
        run: dotnet build Sling.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Sling.slnx --configuration Release --no-build --verbosity normal
